# Render.com Blueprint Configuration for Argus E2EE Gateway Server
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: argus-backend-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: ./data
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "300"
      - key: DATABASE_URL
        sync: false # Set in Render dashboard to your Neon.tech connection string
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "false"
